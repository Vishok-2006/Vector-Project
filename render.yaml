# Render Blueprint: one Docker web service + one persistent disk.
# Deploy: Render Dashboard -> New -> Blueprint -> select this repository.
services:
  - type: web
    name: vectora
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # A persistent disk requires a paid plan. `standard` (2 GB RAM) is recommended: Qdrant, the
    # API, Next.js and nginx share one container. `starter` (512 MB) can run out of memory.
    plan: standard
    healthCheckPath: /healthz
    # Give Qdrant and the API time to flush on every deploy (SIGTERM -> orderly shutdown).
    maxShutdownDelaySeconds: 60
    disk:
      name: vectora-data
      mountPath: /qdrant        # holds /qdrant/storage (vectors), SQLite and the session key
      sizeGB: 10
    envVars:
      - key: NVIDIA_API_KEY
        sync: false             # you will be prompted for it; it is never stored in git
      - key: NVIDIA_MODEL
        value: meta/llama-3.3-70b-instruct
      - key: EMBEDDING_PROVIDER
        value: nvidia
      - key: SESSION_SECRET
        generateValue: true     # stable signing key for session cookies
      - key: MAX_UPLOAD_MB
        value: "25"
      # Optional but recommended for public URLs (prompted if left as sync:false):
      - key: BASIC_AUTH_USER
        sync: false
      - key: BASIC_AUTH_PASSWORD
        sync: false
