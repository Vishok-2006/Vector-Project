; Process supervisor for the single container. PID 1 is tini -> entrypoint.sh -> supervisord.
; Start order (priority, low first): qdrant -> backend -> frontend -> nginx.
; Stop order is the reverse: nginx stops accepting traffic first, Qdrant flushes last.
; The entrypoint copies this file to /tmp/vectora-run and drops the `user=app` lines when the
; container is started as a non-root user.
[supervisord]
user=root
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/vectora-run/supervisord.pid
childlogdir=/tmp/vectora-run
loglevel=info

[eventlistener:fatal_exit]
; If any service exhausts its restart attempts, stop the whole container so the
; platform (Render/Docker) restarts it instead of leaving a half-working app running.
command=python3 /app/deploy/fatal_listener.py
events=PROCESS_STATE_FATAL
autorestart=true
stdout_logfile=NONE
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:qdrant]
command=/usr/local/bin/qdrant --config-path /app/deploy/qdrant.yaml
directory=/qdrant
user=app
priority=10
autostart=true
autorestart=true
startsecs=3
startretries=5
stopsignal=TERM
stopwaitsecs=25
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:backend]
command=python -m uvicorn main:app --host 127.0.0.1 --port 8000 --no-access-log --timeout-graceful-shutdown 15
directory=/app/backend
user=app
priority=20
autostart=true
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=25
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:frontend]
command=node /app/frontend/server.js
directory=/app/frontend
user=app
environment=NODE_ENV="production",PORT="3000",HOSTNAME="127.0.0.1",NEXT_TELEMETRY_DISABLED="1"
priority=30
autostart=true
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:nginx]
command=/app/deploy/start-nginx.sh
; no user=: nginx's master needs root to open the log pipes; its workers run as "app" (see nginx.conf)
priority=40
autostart=true
autorestart=true
startsecs=3
startretries=5
stopsignal=QUIT
stopwaitsecs=15
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
